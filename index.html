<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TickTick‑lite</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#22c55e; --danger:#ef4444; --warn:#f59e0b; }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#0b1023,#0f172a);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .wrap{max-width:920px;margin:32px auto;padding:0 16px}
    header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    header h1{font-size:24px;margin:0}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .controls{padding:16px}
    label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
    input[type="text"], input[type="date"], select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#0b1226;color:var(--text)}
    .grid{display:grid;grid-template-columns:1.6fr 140px 140px 1fr auto;gap:12px}
    @media (max-width:720px){ .grid{grid-template-columns:1fr 1fr 1fr;}
      .grid .span-2{grid-column:1/-1}
    }
    button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-weight:600}
    .btn{background:#1f2937;color:#fff}
    .btn:hover{filter:brightness(1.1)}
    .btn-add{background:var(--accent)}
    .btn-del{background:var(--danger)}
    .btn-warn{background:var(--warn)}
    .tabs{display:flex;gap:8px;padding:10px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06)}
    .tab{padding:8px 12px;border-radius:999px;background:#1f2937;color:#fff;opacity:.8}
    .tab.active{opacity:1;outline:2px solid rgba(255,255,255,.14)}
    .list{padding:8px}
    .empty{padding:16px;color:var(--muted)}
    .task{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:12px;border-bottom:1px dashed rgba(255,255,255,.06)}
    .task:last-child{border-bottom:0}
    .task .title{font-weight:600}
    .task.completed .title{opacity:.6;text-decoration:line-through}
    .pill{font-size:12px;border:1px solid rgba(255,255,255,.18);padding:3px 8px;border-radius:999px;color:#d1d5db}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}
    .actions{display:flex;gap:8px}
    .count{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>TickTick‑lite</h1>
      <span class="count" id="taskCount"></span>
    </header>

    <!-- Create/Edit -->
    <section class="card controls">
      <div class="grid">
        <div class="span-2">
          <label for="title">Task</label>
          <input id="title" type="text" placeholder="e.g. Buy milk #groceries" />
        </div>
        <div>
          <label for="due">Due</label>
          <input id="due" type="date" />
        </div>
        <div>
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="none">None</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="span-2">
          <label for="tags">Tags (comma‑separated)</label>
          <input id="tags" type="text" placeholder="work, urgent" />
        </div>
        <div style="display:flex;gap:8px;align-items:end">
          <button id="addBtn" class="btn btn-add">Add</button>
          <button id="resetBtn" class="btn btn-warn" title="Reset form">Reset</button>
        </div>
      </div>
    </section>

    <!-- Tabs -->
    <nav class="card tabs" id="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="today">Today</button>
      <button class="tab" data-filter="upcoming">Upcoming</button>
      <button class="tab" data-filter="overdue">Overdue</button>
      <button class="tab" data-filter="completed">Completed</button>
    </nav>

    <!-- List -->
    <section class="card list" id="list"></section>
  </div>

  <script>
    // ===== State & Storage =====
    const LS_KEY = 'ttlite_tasks';
    const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

    /** @type {Array<{id:string,title:string,due?:string,priority:'none'|'low'|'medium'|'high',tags:string[],completed:boolean,createdAt:number,updatedAt:number}>} */
    let tasks = [];

    function load(){ try{ tasks = JSON.parse(localStorage.getItem(LS_KEY)||'[]'); }catch{ tasks=[] } }
    function save(){ localStorage.setItem(LS_KEY, JSON.stringify(tasks)); }

    // ===== DOM =====
    const el = {
      title: document.getElementById('title'),
      due: document.getElementById('due'),
      priority: document.getElementById('priority'),
      tags: document.getElementById('tags'),
      addBtn: document.getElementById('addBtn'),
      resetBtn: document.getElementById('resetBtn'),
      list: document.getElementById('list'),
      tabs: document.getElementById('tabs'),
      count: document.getElementById('taskCount'),
    };

    let currentFilter = 'all';

    // ===== Helpers =====
    function parseTags(s){
      return (s||'').split(',').map(t=>t.trim()).filter(Boolean);
    }

    function isToday(dateStr){
      if(!dateStr) return false;
      const d = new Date(dateStr);
      const now = new Date();
      return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
    }

    function isOverdue(dateStr){
      if(!dateStr) return false;
      const d = new Date(dateStr);
      const today = new Date(); today.setHours(0,0,0,0);
      return d < today;
    }

    function isUpcoming(dateStr){
      if(!dateStr) return false;
      const d = new Date(dateStr);
      const today = new Date(); today.setHours(0,0,0,0);
      return d > today;
    }

    function fmtDate(d){ if(!d) return ''; const x = new Date(d + 'T00:00:00'); return x.toLocaleDateString(); }

    function sortTasks(a,b){
      if(a.completed !== b.completed) return a.completed - b.completed; // incomplete first
      const ad = a.due ? new Date(a.due).getTime() : Infinity;
      const bd = b.due ? new Date(b.due).getTime() : Infinity;
      if(ad !== bd) return ad - bd;
      return a.createdAt - b.createdAt;
    }

    // ===== CRUD =====
    function addTask(){
      const title = el.title.value.trim();
      if(!title){ el.title.focus(); return; }
      const t = {
        id: uid(),
        title,
        due: el.due.value || undefined,
        priority: el.priority.value,
        tags: parseTags(el.tags.value),
        completed: false,
        createdAt: Date.now(),
        updatedAt: Date.now(),
      };
      tasks.push(t); save(); render(); clearForm();
    }

    function updateTask(id, patch){
      const i = tasks.findIndex(x=>x.id===id);
      if(i>-1){ tasks[i] = {...tasks[i], ...patch, updatedAt: Date.now()}; save(); render(); }
    }

    function deleteTask(id){ tasks = tasks.filter(t=>t.id!==id); save(); render(); }

    function clearForm(){ el.title.value=''; el.due.value=''; el.priority.value='none'; el.tags.value=''; }

    // ===== Render =====
    function filtered(){
      switch(currentFilter){
        case 'today': return tasks.filter(t=>!t.completed && isToday(t.due));
        case 'upcoming': return tasks.filter(t=>!t.completed && isUpcoming(t.due));
        case 'overdue': return tasks.filter(t=>!t.completed && isOverdue(t.due));
        case 'completed': return tasks.filter(t=>t.completed);
        default: return tasks.slice();
      }
    }

    function render(){
      const data = filtered().sort(sortTasks);
      el.count.textContent = `${tasks.filter(t=>!t.completed).length} open • ${tasks.filter(t=>t.completed).length} done`;
      if(data.length===0){ el.list.innerHTML = `<div class="empty">No tasks here. Add one above ✨</div>`; return; }
      el.list.innerHTML = data.map(t=>{
        const pills = [ t.priority!=='none' ? `<span class="pill">${t.priority}</span>` : '', t.due?`<span class="pill">${fmtDate(t.due)}</span>`:'' ].join('');
        const tags = t.tags?.length? `<div class="tags">${t.tags.map(x=>`<span class="pill">#${x}</span>`).join('')}</div>`:'';
        return `
          <div class="task ${t.completed?'completed':''}" data-id="${t.id}">
            <input type="checkbox" ${t.completed?'checked':''} aria-label="complete">
            <div>
              <div class="title">${escapeHtml(t.title)}</div>
              <div class="meta">${pills} ${tags}</div>
            </div>
            <div class="actions">
              <button class="btn" data-action="edit">Edit</button>
              <button class="btn btn-del" data-action="delete">Delete</button>
            </div>
          </div>`;
      }).join('');
    }

    function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

    // ===== Events =====
    el.addBtn.addEventListener('click', addTask);
    el.resetBtn.addEventListener('click', clearForm);
    el.title.addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });

    el.tabs.addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-filter]'); if(!btn) return;
      currentFilter = btn.dataset.filter;
      [...el.tabs.children].forEach(b=>b.classList.toggle('active', b===btn));
      render();
    });

    el.list.addEventListener('click', (e)=>{
      const taskEl = e.target.closest('.task'); if(!taskEl) return;
      const id = taskEl.dataset.id;
      if(e.target.matches('input[type="checkbox"]')){ updateTask(id,{completed:e.target.checked}); return; }
      const actionBtn = e.target.closest('button'); if(!actionBtn) return;
      const action = actionBtn.dataset.action;
      if(action==='delete') deleteTask(id);
      if(action==='edit') openEdit(id);
    });

    function openEdit(id){
      const t = tasks.find(x=>x.id===id); if(!t) return;
      const title = prompt('Edit title', t.title); if(title===null) return;
      const due = prompt('Edit due (YYYY-MM-DD or empty)', t.due||''); if(due===null) return;
      const priority = prompt('Priority none|low|medium|high', t.priority); if(priority===null) return;
      const tags = prompt('Tags comma‑separated', t.tags.join(',')); if(tags===null) return;
      updateTask(id,{ title: title.trim()||t.title, due: (due||'').trim()||undefined, priority: (priority||'none'), tags: parseTags(tags) });
    }

    // ===== Init =====
    load(); render();
  </script>
</body>
</html>
